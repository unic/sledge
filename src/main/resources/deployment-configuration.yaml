# Sledgefile example

artifactsPathPrefix: packages/

uninstallationDefs:
  - my-package-artifactId-01
  - my-package-artifactId-02
  - my-package-artifactId-03

installationDefs:
  - name: "local-author"
    artifacts:
      - my-package-1.0.zip
      - my-package2-1.0.zip
  - name: "dev-author"
    artifacts:
      - my-package-1.0.zip
      - my-package2-1.0.zip
  - name: "dev-publish"
    artifacts:
      - my-package-1.0.zip
      - my-package2-1.0.zip
  - name: "test-author"
    artifacts:
      - my-package-1.0.zip
      - my-package2-1.0.zip
  - name: "test-publish"
    artifacts:
      - my-package-1.0.zip
      - my-package2-1.0.zip
  - name: "prod-author1"
    artifacts:
      - my-package-1.0.zip
      - my-package2-1.0.zip
  - name: "prod-author2"
    artifacts:
      - my-package-1.0.zip
      - my-package2-1.0.zip
  - name: "prod-publish1"
    artifacts:
      - my-package-1.0.zip
      - my-package2-1.0.zip
  - name: "prod-publish2"
    artifacts:
      - my-package-1.0.zip
      - my-package2-1.0.zip
